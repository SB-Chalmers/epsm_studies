[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "epsm_studies"
version = "0.3.0"
description = "EPSM research protocol records and historical study archives"
requires-python = ">=3.11"

[project.optional-dependencies]
workflows = ["epsm_workflows>=0.3.0"]
results = ["numpy>=1.24"]
dev = ["pytest>=8", "numpy>=1.24"]

[tool.setuptools.packages.find]
where = ["src"]
include = ["epsm_studies"]
namespaces = false

[tool.pytest.ini_options]
testpaths = ["tests"]
norecursedirs = ["archive", "imports", ".*", "build", "dist", "venv"]
