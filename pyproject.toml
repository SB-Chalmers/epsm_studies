[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "epsm_studies"
version = "0.1.0.dev0"
description = "Named EPSM research studies and reproducible historical study archives"
requires-python = ">=3.11"

[project.optional-dependencies]
legacy = ["epsm_workflows[campaign,stock,weather]", "epsm_data"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"epsm_studies.legacy_workflows" = ["data/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
